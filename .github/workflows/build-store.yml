name: Build Chrome Web Store ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  store-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble extension
        run: python tools/assemble.py
      - name: Package Web Store ZIP
        run: |
          VERSION=$(python -c "import json; print(json.load(open('manifest.json'))['version'])")
          python tools/build_store_package.py --repo . --out "dist/Streamer-Web-Tools-v${VERSION}-Chrome-Web-Store.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Chrome-Web-Store-ZIP
          path: dist/*-Chrome-Web-Store.zip
          if-no-files-found: error
