name: Build unpacked extension
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble original extension features
        run: python tools/assemble.py
      - name: Verify extension files
        run: |
          python -m json.tool manifest.json > /dev/null
          test -f filter/core.js
          test -f unicode_filter.js
          test -f filter_mode.js
          test -f filter_mode_ui.js
          node --check unicode_filter.js
          node tools/test_unicode_filter.js
          node tools/test_filter_mode.js
          node --check popup.js
          test -f rules/shared.js
          test -f mhtml/offscreen.html
      - uses: actions/upload-artifact@v4
        with:
          name: Streamer-Web-Tools-unpacked
          path: |
            manifest.json
            background.js
            popup.html
            popup.css
            popup.js
            sidebar.html
            terms.html
            terms.css
            options.html
            options.js
            options-shell.js
            options.css
            filter-embedded.css
            unicode_filter.js
            filter_mode.js
            filter_mode_ui.js
            shared/
            filter/
            rules/
            mhtml/
