name: Publish signed Streamer Web Tools CRX

on:
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  packed-release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install signer dependency
        run: python -m pip install 'cryptography>=43,<48'

      - name: Load permanent private signing key
        env:
          CRX_PRIVATE_KEY_B64: ${{ secrets.CRX_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CRX_PRIVATE_KEY_B64" ]]; then
            echo 'CRX_PRIVATE_KEY_B64 secret is missing. See README-PACKED-UPDATES.md.' >&2
            exit 1
          fi
          printf '%s' "$CRX_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/streamer-web-tools.pem"
          chmod 600 "$RUNNER_TEMP/streamer-web-tools.pem"

      - name: Assemble combined extension
        run: python tools/assemble.py

      - name: Build signed CRX and update manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python tools/build_crx_release.py \
            --repo . \
            --key "$RUNNER_TEMP/streamer-web-tools.pem" \
            --out dist \
            --tag "$RELEASE_TAG"

      - name: Attach CRX and unpacked ZIP to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/*.crx dist/*-unpacked.zip --clobber

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - id: deploy
        uses: actions/deploy-pages@v4

  chrome-web-store:
    name: Submit Chrome Web Store update
    needs: packed-release
    if: ${{ vars.CWS_PUBLISHER_ID != '' && vars.CWS_EXTENSION_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chrome Web Store API client dependencies
        run: python -m pip install 'google-auth>=2,<3' 'requests>=2,<3'
      - name: Assemble extension
        run: python tools/assemble.py
      - name: Create sanitized store upload ZIP
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python tools/build_store_package.py --repo . --out dist/Streamer-Web-Tools-Chrome-Web-Store.zip --tag "$RELEASE_TAG"
      - name: Upload and submit existing store item
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
        run: python tools/publish_chrome_web_store.py dist/Streamer-Web-Tools-Chrome-Web-Store.zip
